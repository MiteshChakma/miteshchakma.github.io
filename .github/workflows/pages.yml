# Builds github-repos.json and deploys the site to GitHub Pages (no npm on the live site).
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate github-repos.json from profile README + API
        env:
          GITHUB_USERNAME: MiteshChakma
          GITHUB_PROFILE_REPO: MiteshChakma
          GITHUB_README_BRANCH: master
          GITHUB_EXCLUDE_REPOS: MiteshChakma
          GITHUB_MAX_REPOS: "24"
        run: python scripts/generate_github_repos.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
